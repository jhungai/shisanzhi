<script>
if('serviceWorker' in navigator){
  const b=document.getElementById('upd');let reloading=false,asked=false;
  const offer=w=>{b.classList.add('on');b.onclick=()=>{asked=true;w.postMessage('SKIP_WAITING')}};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading||!asked)return;reloading=true;location.reload()});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w)})});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
}
</script>
